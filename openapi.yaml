openapi: 3.0.4
info:
  title: Motor Carrier Lookup
  description: >-
    Motor Carrier Lookup returns the FMCSA record of a trucking or bus company
    from its USDOT number or its MC, MX or FF docket number. It covers USDOT
    status, entity and operation type, addresses, dockets, fleet and driver
    counts, MCS-150 date, safety rating, out-of-service orders, operating
    authority status and insurance on file. Paid plans add contact details,
    cargo classes, equipment, mileage, crash rate, insurance policies, authority
    history and pass/fail compliance checks with your own thresholds.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/motorcarrierlookup:
    get:
      summary: Motor Carrier Lookup
      description: >-
        Get the FMCSA census, authority, insurance and out-of-service record of
        a carrier by USDOT or MC/MX/FF docket number
      operationId: motorcarrierlookup
      parameters:
        - name: dot
          in: query
          schema:
            type: string
          required: false
          description: USDOT number, for example 80806. Use dot, docket or mc
          example: '80806'
        - name: docket
          in: query
          schema:
            type: string
          required: false
          description: 'Docket number with its prefix: MC, MX or FF, for example MC135797'
          example: MC135797
        - name: mc
          in: query
          schema:
            type: string
          required: false
          description: MC number without the prefix, for example 135797
          example: '135797'
        - name: checks
          in: query
          schema:
            type: boolean
          required: false
          description: Add pass/fail compliance checks against the thresholds below
          example: true
        - name: history
          in: query
          schema:
            type: boolean
          required: false
          description: Add authority history and revocations
          example: true
        - name: minBipd
          in: query
          schema:
            type: integer
          required: false
          description: 'Compliance threshold: minimum BI&PD insurance on file in US dollars'
          example: 750000
        - name: minCargo
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Compliance threshold: minimum cargo insurance in US dollars; 0 skips
            the check
          example: 100000
        - name: maxMcs150Months
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Compliance threshold: the MCS-150 must be updated within this many
            months
          example: 24
        - name: minAuthorityDays
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Compliance threshold: minimum days since operating authority was
            first granted
          example: 90
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  dotNumber: 80806
